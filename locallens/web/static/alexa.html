<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalLens · Amazon Alexa+ Multimodal Smart Display Simulator</title>
<style>
:root {
  --bg: #090e17;
  --panel: #111a2e;
  --card: #18243c;
  --card-hover: #1e2d4a;
  --border: #233454;
  --ink: #eaf1ff;
  --muted: #8ea4c8;
  --ring: #00d2ff;
  --alexa-blue: #00a8e8;
  --accent: #2a8cff;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1400px 700px at 50% -10%, #17345f, var(--bg));
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 40px;
}
header {
  text-align: center;
  margin-bottom: 20px;
  max-width: 780px;
}
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(0, 210, 255, 0.12);
  color: var(--ring);
  border: 1px solid rgba(0, 210, 255, 0.3);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
h1 {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
}
.subtitle {
  color: var(--muted);
  font-size: 14px;
}

/* Echo Show 10 Hardware Frame */
.echo-frame {
  width: 100%;
  max-width: 820px;
  background: #000;
  border-radius: 28px;
  padding: 14px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px #26334d;
  position: relative;
  margin-bottom: 24px;
}
.echo-screen {
  background: radial-gradient(circle at 50% 0%, #162644, #0c1424);
  border-radius: 18px;
  overflow: hidden;
  min-height: 480px;
  display: flex;
  flex-direction: column;
  position: relative;
}
.echo-status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 18px;
  background: rgba(0, 0, 0, 0.3);
  font-size: 13px;
  color: var(--muted);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.echo-status-bar .alexa-logo {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ring);
  font-weight: 700;
}
.alexa-lightbar {
  height: 4px;
  width: 100%;
  background: transparent;
  transition: all 0.3s ease;
}
.alexa-lightbar.active {
  background: linear-gradient(90deg, transparent, #00d2ff, #0051ff, #00d2ff, transparent);
  box-shadow: 0 0 16px #00d2ff;
  animation: pulseLight 2s infinite linear;
}
@keyframes pulseLight {
  0% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(25deg); }
  100% { filter: hue-rotate(0deg); }
}

/* Echo Screen Content */
.echo-content {
  flex: 1;
  padding: 24px;
  display: flex;
  flex-direction: column;
}
.orb-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 0;
}
.orb {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  background: radial-gradient(circle at 50% 35%, #2a94ff, #08285c);
  box-shadow: 0 0 0 6px rgba(0, 210, 255, 0.18), 0 0 45px rgba(0, 210, 255, 0.45);
  color: #fff;
  font: 700 14px system-ui;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  transition: all 0.25s ease;
}
.orb:hover {
  transform: scale(1.04);
  box-shadow: 0 0 0 8px rgba(0, 210, 255, 0.28), 0 0 60px rgba(0, 210, 255, 0.65);
}
.orb.listening {
  animation: pulseOrb 1.2s infinite;
  background: radial-gradient(circle at 50% 35%, #00d2ff, #0a4da6);
}
.orb.thinking {
  animation: spinOrb 1.4s linear infinite;
  background: conic-gradient(var(--ring), #2a8cff, #0a2654, var(--ring));
}
@keyframes pulseOrb {
  50% { box-shadow: 0 0 0 20px rgba(0, 210, 255, 0.1), 0 0 70px rgba(0, 210, 255, 0.8); }
}
@keyframes spinOrb {
  to { transform: rotate(1turn); }
}

.query-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 16px 0;
}
.pill {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--ink);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.pill:hover {
  background: var(--card-hover);
  border-color: var(--ring);
  transform: translateY(-1px);
}

/* Multimodal Display Card */
.display-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  animation: fadeIn 0.4s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.spoken-box {
  background: rgba(0, 210, 255, 0.08);
  border-left: 4px solid var(--ring);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 500;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.spoken-box svg {
  flex-shrink: 0;
  color: var(--ring);
}

/* Metrics Row */
.card-header-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 20px;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.score-gauge {
  position: relative;
  width: 90px;
  height: 90px;
}
.score-gauge svg {
  transform: rotate(-90deg);
}
.score-gauge-val {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.score-gauge-val .number {
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
}
.score-gauge-val .denom {
  font-size: 11px;
  color: var(--muted);
}
.biz-details h2 {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.biz-meta {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.meta-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Competitor Matrix */
.matrix-section h3, .fixes-section h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.competitor-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.comp-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
}
.comp-name {
  font-weight: 600;
  flex: 1;
}
.comp-stats {
  display: flex;
  gap: 14px;
  align-items: center;
  color: var(--muted);
  font-size: 13px;
}
.comp-score-bar {
  width: 80px;
  height: 8px;
  background: #25334c;
  border-radius: 4px;
  overflow: hidden;
}
.comp-score-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
}

/* Fixes List */
.fixes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 10px;
}
.fix-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.fix-title {
  font-weight: 600;
  font-size: 14px;
  color: #fff;
  margin-bottom: 4px;
}
.fix-why {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}
.fix-tags {
  display: flex;
  gap: 6px;
}
.tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 600;
}
.tag-impact-high { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
.tag-effort { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }

/* Bottom Action Bar */
.action-bar {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 16px;
  border-radius: 8px;
  border: 0;
  font: 600 13px system-ui;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #3b97ff; }
.btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--card-hover); }
.btn-whatsapp { background: #128c7e; color: #fff; }
.btn-whatsapp:hover { background: #25d366; color: #000; }
.btn-nebius { background: #76b900; color: #000; font-weight: 700; }
.btn-nebius:hover { background: #8deb00; }

.nebius-box {
  margin-top: 14px;
  background: rgba(118, 185, 0, 0.08);
  border: 1px solid rgba(118, 185, 0, 0.35);
  border-radius: 12px;
  padding: 14px 16px;
  animation: fadeIn 0.3s ease;
}
.nebius-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 700;
  color: #76b900;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.nebius-text {
  font-size: 13px;
  color: #eaf1ff;
  line-height: 1.5;
  margin-bottom: 8px;
}
.nebius-fixes {
  margin-left: 18px;
  font-size: 12px;
  color: #8ea4c8;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Text input fallback */
.input-row {
  display: flex;
  gap: 8px;
  width: 100%;
  margin-top: 14px;
}
.input-row input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--ink);
  font: inherit;
}
.input-row button {
  padding: 12px 20px;
  border-radius: 10px;
  border: 0;
  background: var(--accent);
  color: #fff;
  font: 600 14px system-ui;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <div class="badge">Amazon Alexa+ Multimodal Developer Challenge</div>
  <h1>LocalLens on Echo Show</h1>
  <p class="subtitle">Autonomous Model Context Protocol (MCP) server providing real-time local SEO & competitive audits for SMBs.</p>
</header>

<div class="echo-frame">
  <div class="echo-screen">
    <div class="echo-status-bar">
      <div class="alexa-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>Echo Show 10</span>
      </div>
      <div>LocalLens MCP · Streamable HTTP (Port 8765)</div>
    </div>
    <div id="lightbar" class="alexa-lightbar"></div>

    <div class="echo-content">
      <div class="orb-container">
        <button id="orb" class="orb" aria-label="Talk to LocalLens">Tap to Talk</button>
      </div>

      <div class="query-pills">
        <button class="pill" onclick="runPreset('Sunrise Dental Care, Mangalagiri')">“How is Sunrise Dental Care doing?”</button>
        <button class="pill" onclick="runPreset('Apollo Pharmacy, Mangalagiri')">“Check Apollo Pharmacy in Mangalagiri”</button>
        <button class="pill" onclick="runPreset('Siri Dental, Guntur')">“Analyze Siri Dental in Guntur”</button>
      </div>

      <div id="resultCard" style="display:none;"></div>

      <form id="f" class="input-row">
        <input id="q" placeholder="Or type a business & town, e.g. Sunrise Dental Care in Mangalagiri..." autocomplete="off">
        <button type="submit">Ask Alexa</button>
      </form>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const orb = $("#orb"), lightbar = $("#lightbar"), resultCard = $("#resultCard");

function esc(x){ return String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function speak(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-IN";
  u.rate = 1.02;
  speechSynthesis.speak(u);
}

function parseQuery(text){
  let t = text.trim().replace(/^(alexa,?\s*)?(ask|tell)\s+local\s*lens\s*/i, "").replace(/\?$/, "");
  const m = t.match(/(?:how(?:'s| is)|check|analy[sz]e)\s+(.+?)(?:\s+doing)?$/i);
  if (m) t = m[1];
  return t.replace(/\s+in\s+([A-Z][\w-]+)$/i, ", $1");
}

async function ask(queryText){
  orb.className = "orb thinking";
  orb.textContent = "Thinking…";
  lightbar.className = "alexa-lightbar active";

  try {
    const cleanQ = parseQuery(queryText);
    const res = await fetch(`/api/voice?q=${encodeURIComponent(cleanQ)}`);
    const d = await res.json();

    if (d.error) {
      resultCard.innerHTML = `<div class="spoken-box">${esc(d.spoken || d.error)}</div>`;
      resultCard.style.display = "block";
      speak(d.spoken || "Sorry, I couldn't find that business.");
      return;
    }

    // Determine gauge color based on score
    const scoreColor = d.score >= 70 ? "var(--green)" : d.score >= 45 ? "var(--amber)" : "var(--red)";
    const circumference = 2 * Math.PI * 38;
    const offset = circumference - (d.score / 100) * circumference;

    const competitorsHtml = (d.competitors || []).map(c => `
      <div class="comp-row">
        <span class="comp-name">${esc(c.name)}</span>
        <div class="comp-stats">
          <span>★ ${c.rating || "N/A"} (${c.reviews || 0})</span>
          <div class="comp-score-bar">
            <div class="comp-score-fill" style="width: ${c.score || 50}%"></div>
          </div>
          <strong>${c.score || 50}/100</strong>
        </div>
      </div>
    `).join("");

    const fixesHtml = (d.fixes || []).map(f => `
      <div class="fix-card">
        <div>
          <div class="fix-title">${esc(f.title)}</div>
          <div class="fix-why">${esc(f.why)}</div>
        </div>
        <div class="fix-tags">
          <span class="tag tag-impact-high">${esc(f.impact || "High Impact")}</span>
          <span class="tag tag-effort">${esc(f.effort || "1 hour")}</span>
        </div>
      </div>
    `).join("");

    const cardHtml = `
      <div class="display-card">
        <div class="spoken-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <div>${esc(d.spoken)}</div>
        </div>

        <div class="card-header-row">
          <div class="score-gauge">
            <svg width="90" height="90">
              <circle cx="45" cy="45" r="38" stroke="#1f2d47" stroke-width="7" fill="none"/>
              <circle cx="45" cy="45" r="38" stroke="${scoreColor}" stroke-width="7" fill="none"
                      stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
            </svg>
            <div class="score-gauge-val">
              <div class="number" style="color:${scoreColor}">${d.score}</div>
              <div class="denom">/ 100</div>
            </div>
          </div>

          <div class="biz-details">
            <h2>${esc(d.business)}</h2>
            <div class="biz-meta">
              <span class="meta-chip">★ ${d.rating} (${d.reviews_count} reviews)</span>
              <span class="meta-chip">Category: ${esc(d.category)}</span>
              ${d.competitor_average ? `<span class="meta-chip">Competitor Avg: ${d.competitor_average}/100</span>` : ""}
            </div>
          </div>

          <div>
            <span class="tag" style="background:rgba(0,210,255,0.15);color:var(--ring);border:1px solid rgba(0,210,255,0.3);font-size:12px;padding:6px 12px">
              ${d.mode === "fixtures" ? "Sandbox Test Mode" : "Live Google Maps"}
            </span>
          </div>
        </div>

        <div class="matrix-section">
          <h3>Competitive Landscape (Nearby Rivals)</h3>
          <div class="competitor-list">${competitorsHtml}</div>
        </div>

        <div class="fixes-section">
          <h3>Prioritized High-ROI Fixes</h3>
          <div class="fixes-grid">${fixesHtml}</div>
        </div>

        <div id="nebiusSlot"></div>

        <div class="action-bar">
          <a class="btn btn-primary" href="/report" target="_blank">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Open Full Interactive Audit Report
          </a>
          <button class="btn btn-whatsapp" onclick="shareWhatsApp('${esc(d.business)}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.746.953 3.71 1.456 5.711 1.457h.004c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Send WhatsApp Action Plan
          </button>
          <button id="btnNebius" class="btn btn-nebius" onclick="triggerNebius('${esc(d.business)}')">
            ⚡ NVIDIA H100 Synthesis
          </button>
        </div>
      </div>
    `;

    resultCard.innerHTML = cardHtml;
    resultCard.style.display = "block";
    speak(d.spoken);
  } catch (err) {
    resultCard.innerHTML = `<div class="spoken-box">Sorry, an error occurred while connecting to the LocalLens MCP server.</div>`;
    resultCard.style.display = "block";
  } finally {
    orb.className = "orb";
    orb.textContent = "Tap to Talk";
    lightbar.className = "alexa-lightbar";
  }
}

function runPreset(bizName){
  $("#q").value = bizName;
  ask(bizName);
}

$("#f").addEventListener("submit", (e) => {
  e.preventDefault();
  const val = $("#q").value.trim();
  if (val) ask(val);
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
orb.addEventListener("click", () => {
  if (!SR) {
    alert("Speech recognition isn't supported in this browser. Please type your business name.");
    return;
  }
  const rec = new SR();
  rec.lang = "en-IN";
  rec.interimResults = false;
  orb.className = "orb listening";
  orb.textContent = "Listening…";
  lightbar.className = "alexa-lightbar active";

  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    $("#q").value = text;
    ask(text);
  };
  rec.onerror = () => {
    orb.className = "orb";
    orb.textContent = "Tap to Talk";
    lightbar.className = "alexa-lightbar";
  };
  rec.onend = () => {
    if (orb.className === "orb listening") {
      orb.className = "orb";
      orb.textContent = "Tap to Talk";
      lightbar.className = "alexa-lightbar";
    }
  };
  rec.start();
});

async function shareWhatsApp(bizName){
  try {
    const res = await fetch(`/api/whatsapp?q=${encodeURIComponent(bizName)}&lang=en`);
    const d = await res.json();
    if (d.wa_link) {
      window.open(d.wa_link, "_blank");
    }
  } catch(e) {
    alert("Unable to generate WhatsApp link");
  }
}

async function triggerNebius(bizName){
  const slot = $("#nebiusSlot");
  const btn = $("#btnNebius");
  if (!slot) return;
  btn.textContent = "Synthesizing on NVIDIA H100...";
  btn.disabled = true;

  try {
    const res = await fetch(`/api/nebius/synthesis?q=${encodeURIComponent(bizName)}`);
    const d = await res.json();
    const synth = d.nebius_synthesis || {};
    slot.innerHTML = `
      <div class="nebius-box">
        <div class="nebius-header">
          <span>⚡ ${esc(synth.hardware || "NVIDIA H100 Hopper SXM5")}</span>
          <span>${synth.tokens_per_sec || 64.2} tokens/sec</span>
        </div>
        <div class="nebius-text">${esc(synth.competitive_gap || "Competitive gap identified.")}</div>
        <div style="font-size:12px; font-weight:600; color:#eaf1ff; margin-bottom:4px;">Recommended Next Action:</div>
        <ul class="nebius-fixes">
          ${(synth.critical_fixes || []).map(f => `<li>${esc(f)}</li>`).join("")}
        </ul>
      </div>
    `;
    btn.textContent = "✔ NVIDIA H100 Synthesis Complete";
  } catch(e) {
    slot.innerHTML = `<div class="nebius-box" style="border-color:red; color:red;">Failed to synthesize on Nebius Studio endpoint.</div>`;
    btn.textContent = "⚡ NVIDIA H100 Synthesis";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
